<div class="page-header">
  <div class="page-title">Scraping des items</div>
  <span class="flex-spacer"></span>
  <app-back-button />
</div>

<!-- Toolbar admin -->
<div class="admin-toolbar">
  <button
    mat-stroked-button
    disabled
    matTooltip="Ajout d’item (P2)">
    <mat-icon>add</mat-icon>
    Ajouter un item
  </button>

  <button
    mat-raised-button
    color="primary"
    disabled
    matTooltip="Scraping (à venir)">
    <mat-icon>sync</mat-icon>
    Lancer le scraping
  </button>
</div>

<!-- Filtres -->
<div *ngIf="filters$ | async as filters">
  <app-item-search-filters
    [filters]="filters"
    (searchFilters)="onSearch($event)" />
</div>

<!-- Résultats -->
<div *ngIf="itemsPage$ | async as itemsPage">
  <app-item-scraper-table
    [itemsPage]="itemsPage"
    (pageChange)="onPageChange($event)"
    (toggleScraping)="onToggleScraping($event)" 
    (toggleAllScraping)="onToggleAllScraping($event)"/>
</div>
