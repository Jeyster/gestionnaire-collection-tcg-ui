<div class="page-header">
  <div class="page-title">Scraping des items</div>
  <span class="flex-spacer"></span>
  <app-back-button />
</div>

<!-- Toolbar admin -->
<div class="admin-toolbar">
  <div class="add-buttons">

    <button
      mat-raised-button 
      (click)="addItemDialog()">
      <mat-icon>add</mat-icon>
      Ajouter un item
    </button>
  
    <button
      mat-raised-button 
      (click)="addGameDialog()">
      Ajouter un jeu
    </button>

    <button
      mat-raised-button 
      (click)="addExpansionDialog()">
      Ajouter une extension
    </button>

    <button
      mat-raised-button 
      (click)="addItemTypeDialog()">
      Ajouter un type d'item
    </button>

    <button
      mat-raised-button 
      (click)="addLocaleDialog()">
      Ajouter un langage
    </button>

  </div>

  <div class="add-buttons">

    <button
      mat-icon-button
      matTooltip="Voir les logs"
      class="icon-action"
      (click)="openLogsDialog()">
      <mat-icon>terminal</mat-icon>
    </button>

    <button
      mat-raised-button
      color="primary"
      (click)="startScraping()"
      [disabled]="scrapingRunning$ | async">
      <mat-icon>sync</mat-icon>
      Lancer le scraping
    </button>

  </div>

</div>

<!-- Filtres -->
<div *ngIf="filters$ | async as filters">
  <app-item-search-filters
    [filters]="filters"
    [parentRefresh$]="refresh$"
    (searchFilters)="onSearch($event)" />
</div>

<!-- Résultats -->
<div *ngIf="itemsPage$ | async as itemsPage">
  <app-item-scraper-table
    [itemsPage]="itemsPage"
    (pageChange)="onPageChange($event)"
    (toggleScraping)="onToggleScraping($event)" 
    (toggleAllScraping)="onToggleAllScraping($event)"/>
</div>
