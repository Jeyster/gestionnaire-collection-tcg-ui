<mat-card class="flex-card" appearance="outlined">

  <mat-card-content class="item-card-content">

    <app-item-infos [item]="item" [multiline]="true"/>

    <div class="item-meta-info">
  
      <app-user-items-infos-compact
        *ngIf="userItemsCount$ | async as userItemsCount"
        [item]="item"
        [userItemsCount]="userItemsCount"
      />

      <app-item-cardmarket-infos-compact 
        *ngIf="lastPriceHistory$ | async as lastPriceHistory" 
        [itemPriceHistory]="lastPriceHistory"
      />
      
    </div>

  </mat-card-content>

</mat-card>
