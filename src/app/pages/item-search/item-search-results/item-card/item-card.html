<mat-card class="flex-card" appearance="outlined">

  <mat-card-content>

    <app-item-infos [item]="item" [multiline]="true"/>

    <app-item-cardmarket-infos-compact 
      *ngIf="lastPriceHistory$ | async as lastPriceHistory" 
      [itemPriceHistory]="lastPriceHistory"
    />

  </mat-card-content>

  <mat-card-actions>

    <button mat-stroked-button
            [routerLink]="['/items', item.id, 'user-items']">
      <mat-icon>inventory</mat-icon>
      Mes Items
    </button>

  </mat-card-actions>

</mat-card>
