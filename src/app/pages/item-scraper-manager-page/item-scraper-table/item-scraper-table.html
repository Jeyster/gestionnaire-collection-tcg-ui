<table mat-table [dataSource]="itemsPage.content" class="mat-elevation-z1">

  <!-- Game -->
  <ng-container matColumnDef="game">
    <th mat-header-cell *matHeaderCellDef>Jeu</th>
    <td mat-cell *matCellDef="let item">{{ item.game.name }}</td>
  </ng-container>

  <!-- Type -->
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Type d'item</th>
    <td mat-cell *matCellDef="let item">{{ item.itemType.name }}</td>
  </ng-container>

  <!-- Expansion -->
  <ng-container matColumnDef="expansion">
    <th mat-header-cell *matHeaderCellDef>Extension</th>
    <td mat-cell *matCellDef="let item">{{ item.expansion.name }}</td>
  </ng-container>

  <!-- Locale -->
  <ng-container matColumnDef="locale">
    <th mat-header-cell *matHeaderCellDef>Langue</th>
    <td mat-cell *matCellDef="let item">{{ item.locale.name }}</td>
  </ng-container>

  <!-- Complement -->
  <ng-container matColumnDef="complement">
    <th mat-header-cell *matHeaderCellDef>Complément</th>
    <td mat-cell *matCellDef="let item">{{ item.complement }}</td>
  </ng-container>

  <!-- Scraping -->
  <ng-container matColumnDef="scraping">
    <th mat-header-cell *matHeaderCellDef>Scraping CM</th>
    <td mat-cell *matCellDef="let item">
      <mat-checkbox
        [checked]="item.isCmScrapingActive"
        (change)="toggleScraping.emit(item)">
      </mat-checkbox>
    </td>
  </ng-container>

  <!-- Header / Rows -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;"
    [class.scraping-active]="row.isCmScrapingActive">
  </tr>

</table>

<mat-paginator
  [length]="itemsPage.totalElements"
  [pageIndex]="itemsPage.number"
  [pageSize]="itemsPage.size"
  [pageSizeOptions]="[12, 24, 48]"
  (page)="pageChange.emit($event)">
</mat-paginator>
