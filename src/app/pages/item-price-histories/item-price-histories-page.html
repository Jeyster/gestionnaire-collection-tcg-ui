<div class="page-header">

  <div class="page-title">Historique des prix</div>

  <div *ngIf="item$ | async as item">
    <app-item-infos [item]="item"/>
  </div>

  <span class="flex-spacer"></span>

  <div>
    <app-back-button/>
  </div>

</div>

<div *ngIf="lastPriceHistory$ | async as lastPriceHistory" class="price-info-bar">
  <app-cardmarket-event [itemPriceHistory]="lastPriceHistory"/>
</div>

<div class="chart-container">
    <canvas #priceChart></canvas>
</div>
