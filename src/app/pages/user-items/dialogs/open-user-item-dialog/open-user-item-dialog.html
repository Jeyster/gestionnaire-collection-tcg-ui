<app-business-object-dialog-shell
  [form]="form"
  [submit]="submit.bind(this)"
  [cancel]="cancel.bind(this)">

  
  <div dialog-title class="dialog-title">
    <mat-icon class="open-icon">{{ UserItemStatusConfig[UserItemStatus.OPENED].icon }}</mat-icon>
    <h2 mat-dialog-title>Ouvrir cet item</h2>
  </div>

  <div dialog-context class="dialog-context">
    <app-purchase-event [userItem]="data.userItem" />
  </div>
  
  <div class="dialog-form" [formGroup]="form">

    <mat-form-field appearance="outline">
      <mat-label>Date de l'ouverture</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="openingDate">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Commentaire</mat-label>
      <textarea matInput rows="2" formControlName="openingComment"></textarea>
    </mat-form-field>

  </div>

</app-business-object-dialog-shell>
