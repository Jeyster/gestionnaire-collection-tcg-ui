<app-business-object-dialog-shell
  [form]="form"
  [submit]="submit.bind(this)"
  [cancel]="cancel.bind(this)">

  
  <div dialog-title class="dialog-title">
    <mat-icon class="sell-icon">{{ UserItemStatusConfig[UserItemStatus.SOLD].icon }}</mat-icon>
    <h2 mat-dialog-title>Vendre cet item</h2>
  </div>

  <div dialog-context class="dialog-context">
    <app-purchase-event [userItem]="data.userItem" />
  </div>
  
  <div class="dialog-form" [formGroup]="form">

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Prix de vente</mat-label>
        <input matInput type="number" formControlName="sellingPrice">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="sellingDate">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Commentaire</mat-label>
      <textarea matInput rows="2" formControlName="sellingComment"></textarea>
    </mat-form-field>

  </div>

</app-business-object-dialog-shell>
