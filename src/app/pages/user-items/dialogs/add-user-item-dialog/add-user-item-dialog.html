<app-business-object-dialog-shell
  [form]="form"
  [submit]="submit.bind(this)"
  [cancel]="cancel.bind(this)">

  
  <div class="dialog-title" dialog-title>
    <mat-icon class="purchase-icon">{{ UserItemStatusConfig[UserItemStatus.PURCHASED].icon }}</mat-icon>
    <h2 mat-dialog-title>Ajouter un item</h2>
  </div>
  
  <div class="dialog-form" [formGroup]="form">

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Prix d'achat</mat-label>
        <input matInput type="number" formControlName="purchasePrice">
      </mat-form-field>
  
      <mat-form-field appearance="outline">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="purchaseDate">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>
  
    <mat-form-field appearance="outline">
      <mat-label>Commentaire</mat-label>
      <textarea matInput rows="2" formControlName="purchaseComment"></textarea>
    </mat-form-field>

  </div>

</app-business-object-dialog-shell>
