<div
  *ngIf="
    currentUserItemsCount !== null &&
    openedUserItemsCount !== null &&
    soldUserItemsCount !== null
  "
  class="user-items-info"
>

  <!-- Ligne principale -->
  <div class="main-info">
    <mat-icon class="main-icon">inventory_2</mat-icon>

    <div class="main-text">
      <div class="main-count">
        {{ currentUserItemsCount }}
      </div>

      <div class="main-label">
        @if (currentUserItemsCount > 1) {
          exemplaires dans ma collection
        } @else {
          exemplaire dans ma collection
        }
      </div>
    </div>
  </div>

  <!-- Détails -->
  <div class="details">

    <div class="detail opened">
      <mat-icon>auto_awesome</mat-icon>
      <span>{{ openedUserItemsCount }} ouverts</span>
    </div>

    <div class="detail sold">
      <mat-icon>payments</mat-icon>
      <span>{{ soldUserItemsCount }} vendus</span>
    </div>

  </div>

  <!-- Action -->
  <div class="actions">
    <button
      mat-stroked-button
      matTooltip="Voir ma collection"
      [routerLink]="['/items', item.id, 'user-items']"
    >
      <mat-icon>collections</mat-icon>
      Voir ma collection
    </button>
  </div>

</div>
