<!-- 
 Common shell of almost all dialogs of the application.
 <ng-content> displays the content of HTML code that is inside <app-business-object-dialog-shell>.
 dialog-title and dialog-context are specified piece of code identified by these attributes. 
-->

<div class="dialog-header">
  <ng-content select="[dialog-title]"></ng-content>
  <ng-content select="[dialog-context]"></ng-content>
</div>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog-content">
    <ng-content></ng-content>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button mat-button type="button" (click)="cancel()">
      Annuler
    </button>

    <button mat-flat-button color="primary" type="submit">
      <mat-icon>save</mat-icon>
      Enregistrer
    </button>
  </mat-dialog-actions>
</form>
